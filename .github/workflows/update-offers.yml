name: Update Angebote

on:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC — German retailers' weekly offer cycle starts Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-offers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run fetch-offers
      - name: Commit updated offers data
        run: |
          git config user.name "offers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/_data/offers.json
          git diff --staged --quiet || git commit -m "chore: update Angebote-Daten"
          git push
